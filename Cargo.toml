[package]
name = "vincite"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1.24.1", features = ["v4", "serde"] }
serde = { version = "1.0.229", features = ["derive"] }
sqlx = { version = "0.9.0", features = ["postgres", "runtime-tokio", "macros", "time", "uuid", "json"] }
anyhow = "1.0.104"
dotenvy = "0.15.7"
serde_json = "1.0.151"
time = "0.3.55"
thiserror = "2.0.20"
tracing = "0.1"
tracing-subscriber = "0.3"
